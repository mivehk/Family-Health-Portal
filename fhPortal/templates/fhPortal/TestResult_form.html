<html>
   <head>
      <title>
         Family Health Portal
      </title>
        <style type="text/css">
            body{ 
               color: #030c1f;
               font-size:medium;
               text-align:center
            }
            a.button{
               font-size: 20;
               color:#69f;
            }
            .form-group {
                display: flex;
                background-color: #9dd0eb;
                flex-direction: column;
                flex-wrap: wrap;
                align-items: center; /* row is vertically located center from left to right */
                justify-content: space-around; 
            }
        }
      </style>
   </head>
   <body>
{% extends 'base.html' %}      
{% block content %}
  <div class="vertical-shelf">
        <!-- Logout via POST -->
  <div>
    <form action="{% url 'fhAuth:logout' %}" method="post">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
  </div>
		{% if error_message %}
		<p><strong>{{ error_message }}</strong></p>
		{% endif %}
      <div class="form-group">
      <h2>Add Test Result for {{ patient.p_first_name }} {{ patient.p_last_name }}</h2>
      <form action ="" method="post" enctype="multipart/form-data">
           {% csrf_token %}
           {% include 'fhPortal/form-test-template.html' %}
           	<div class="col-sm-offset-2 col-sm-10">
           		<button type="submit" class ="btn btn-success btn-lg"> Submit </button>
           	</div>  
      </form>
      </div><br> 
      <div> <p> </p> <br> </div> 
            <a href="{% url 'fhAuth:index' %}" class="button" > Back to Patients </a>
      </div>      
{% endblock %}	
   </body>  
</html>
<!---This template allows tests' entry form appear in your standard uniform--->
