<html>
   <head>
      <title>
         Family Health Portal
      </title>
        <style type="text/css">
            body{ 
               color: #030c1f;
               font-size:medium;
               text-align:center
            }
            
            a.button{
               font-size: 20;
               color:#69f;
            }
            .form-group {
                background-color: #9dd0eb;
                display: flex;
                flex-direction: column;
                flex-wrap: wrap;
                align-items: center; /* vertically located center from left to right */
                justify-content: space-around; 
            }
            .form-container .form-group {
                display: block; /* Reset Flex properties */
                flex-direction: unset;
                flex-wrap: unset;
                align-items: unset;
                justify-content: unset;
                margin-bottom: 15px; /* Add spacing between fields */
            }
        }
      </style>
   </head>
   <body>
{% extends 'base.html' %}      
{% block content %}
   <div class="vertical-shelf">
        <!-- Logout via POST -->
        <form action="{% url 'fhAuth:logout' %}" method="post">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
		{% if error_message %}
		<p><strong>{{ error_message }}</strong></p>
		{% endif %}

      <div class="form-group">
        <form action ="" method="post" enctype="multipart/form-data">
           {% csrf_token %}
           {% include 'fhPortal/form-template.html' %}

           	<div class="col-sm-offset-2 col-sm-10">
           		<button type="submit" class ="btn btn-success btn-lg"> Submit </button> 
           	</div>
        </form>    
      </div><br>

      <a href="{% url 'fhAuth:index' %}" class="button" > Back to Patients </a> 
   </div>
{% endblock %}	
   </body>  
</html>
<!---This template allows patients'entry form appear in your standard uniform--->
