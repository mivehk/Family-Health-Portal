# This file triggers Google Cloud Build to update Artifact Registry and roll out pods on GKE
substitutions:
  # ---- fill these in once ----
  _PROJECT: familyhealthportal          # your GCP project id
  _REGION: us-central1                  # your Artifact Registry + GKE region
  _AR_REPO: fahep-repo                  # your Artifact Registry repo name
  _CLUSTER: k1-cluster                  # currently using an auto-pilot cluster
  _CLUSTER_LOCATION: us-central1-a      # GKE zone or region
  _NAMESPACE: fhp

options:
  logging: CLOUD_LOGGING_ONLY

# Cloud Build provides $COMMIT_SHA and $SHORT_SHA for trigger builds
images:
  - us-central1-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/fahep:${SHORT_SHA}
  - us-central1-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/nginx:${SHORT_SHA}

steps:
  # 1) Build images
  - name: gcr.io/cloud-builders/docker
    dir: .
    args: [
      "build",
      "-f", "Dockerfile.fahep",
      "-t", "us-central1-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/fahep:${SHORT_SHA}",
      "."
    ]

  - name: gcr.io/cloud-builders/docker
    dir: .
    args: [
      "build",
      "-f", "Dockerfile.nginx",
      "-t", "us-central1-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/nginx:${SHORT_SHA}",
      "."
    ]

  # 2) Push images
  - name: gcr.io/cloud-builders/docker
    args: ["push", "us-central1-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/fahep:${SHORT_SHA}"]

  - name: gcr.io/cloud-builders/docker
    args: ["push", "us-central1-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/nginx:${SHORT_SHA}"]

  # 3) Deploy to GKE with rolling update
  # gke-deploy will read your YAMLs (fahep.yaml, nginx.yaml) and replace images.
  - name: gcr.io/cloud-builders/gke-deploy
    args:
      [
        "run",
        "--filename=fahep.yaml,nginx.yaml",
        "--image=us-central1-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/fahep:${SHORT_SHA}",
        "--image=us-central1-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/nginx:${SHORT_SHA}",
        "--namespace=${_NAMESPACE}",
        "--cluster=${_CLUSTER}",
        "--location=${_CLUSTER_LOCATION}"
      ]
