apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: fhp
spec:
  replicas: 1
  selector:
    matchLabels: { app: nginx }
  template:
    metadata:
      labels: { app: nginx }
    spec:
      containers:
      - name: nginx
        image: us-central1-docker.pkg.dev/familyhealthportal/fahep-repo/nginx:20250817-local
        ports:
          - containerPort: 80
          - containerPort: 443
        volumeMounts:
          - name: nginx-conf
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
          - name: tls
            mountPath: /etc/nginx/ssl
            readOnly: true
        readinessProbe:
          httpGet:
            path: /fhAuth/
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /fhAuth/
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"  
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-conf
        - name: tls
          secret:
            secretName: dev17-tls

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-lb
  namespace: fhp
spec:
  type: LoadBalancer
  loadBalancerIP: 34.133.183.91      # reserved regional static IP
  selector: { app: nginx }
  ports:
    - name: https
      port: 443
      targetPort: 443
    - name: http
      port: 80
      targetPort: 80

