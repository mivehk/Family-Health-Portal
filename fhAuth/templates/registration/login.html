{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div>
	<h2>Login</h2><br>
	<form method="post">
		{% csrf_token %}
		{{ form.as_p }}
		<button type="submit">Login</button>
	</form><br>
	<a href="{% url 'fhAuth:password_reset' %}">Forgot your password?</a>
</div>
{% endblock %}
