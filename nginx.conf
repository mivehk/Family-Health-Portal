worker_processes 1;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # HTTPS virtual host for your domain
    server {
        listen 443 ssl;
        server_name dev17.miveh-nejad.info;

        # These filenames come from a Kubernetes TLS secret
        # mounted at /etc/nginx/ssl in the Pod
        ssl_certificate     /etc/nginx/ssl/tls.crt;
        ssl_certificate_key /etc/nginx/ssl/tls.key;

        # reasonable defaults for local/prod
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # redirect root to your auth entry
        location = / {
            return 301 /fhAuth/;
        }

        # proxy to the app by **Service name** (no fixed IPs)
        location /fhAuth/ {
            proxy_pass http://fahep:8000/fhAuth/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /fhPortal/ {
            proxy_pass http://fahep:8000/fhPortal/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name dev17.miveh-nejad.info;
        return 301 https://$host$request_uri;
    }
}
